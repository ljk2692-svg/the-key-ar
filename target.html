<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE KEY AR 테스트 타깃</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#eef1f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px} main{max-width:760px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.12)} img{width:100%;height:auto;display:block;border-radius:12px} p{line-height:1.6;color:#4b5563} button{margin-top:16px;border:0;border-radius:12px;padding:13px 18px;background:#111827;color:white;font-weight:700} @media print{body{background:white;padding:0}main{box-shadow:none;padding:0;max-width:none}p,button,h1{display:none}img{width:100%;border-radius:0}}
  </style>
</head>
<body>
  <main>
    <h1>THE KEY AR 테스트 타깃</h1>
    <p>이 화면을 PC나 다른 휴대전화에 크게 띄운 뒤 AR 카메라로 비추세요. 인쇄하려면 아래 버튼을 누르세요.</p>
    <img src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" alt="MindAR 테스트 카드 이미지">
    <button onclick="window.print()">인쇄하기</button>
  </main>
</body>
</html>
