<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070b13" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>THE KEY / KEY LENS</title>
  <style>
    :root{--navy:#070b13;--charcoal:#0c1119;--graphite:#1b232f;--white:#f3f5f7;--muted:#a9b2c0;--cyan:#73d9e8;--cyan2:#b9f3fa;--gold:#d4b36b;--danger:#e07a7a;--glass:rgba(9,14,22,.78)}
    *{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,a{font:inherit}#app{position:fixed;inset:0}a-scene{position:absolute!important;inset:0;width:100%!important;height:100%!important}
    #intro{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 78% 14%,rgba(115,217,232,.10),transparent 27%),radial-gradient(circle at 18% 82%,rgba(212,179,107,.08),transparent 33%),linear-gradient(180deg,#080c14,#0c121d)}
    .panel{width:min(100%,520px);padding:28px 22px 24px;border:1px solid rgba(255,255,255,.10);border-radius:22px;background:linear-gradient(180deg,rgba(18,25,36,.97),rgba(8,13,21,.97));box-shadow:0 24px 70px rgba(0,0,0,.42)}.brand{font-size:11px;font-weight:800;letter-spacing:.20em;color:var(--gold)}.lens-title{margin:10px 0 5px;font-size:40px;line-height:1;font-weight:850}.subtitle{color:var(--muted);font-size:14px;line-height:1.55}.keyhole{position:relative;width:82px;height:82px;margin:23px auto 19px}.keyhole:before,.keyhole:after{content:"";position:absolute;inset:0;border:4px solid var(--cyan);border-radius:50%}.keyhole:after{inset:12px;border-color:rgba(212,179,107,.72);border-style:dashed;transform:rotate(22deg)}.keyhole i{position:absolute;left:50%;top:37px;transform:translateX(-50%);width:18px;height:35px;background:linear-gradient(180deg,var(--cyan2),var(--cyan));clip-path:polygon(50% 0,100% 38%,78% 100%,22% 100%,0 38%)}
    .steps{margin:20px 0;padding:0;list-style:none;border-top:1px solid rgba(255,255,255,.08)}.steps li{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);color:var(--muted);font-size:14px}.steps b{color:var(--cyan);font-size:10px;letter-spacing:.12em;padding-top:4px;min-width:52px}.primary{width:100%;border:1px solid rgba(115,217,232,.48);border-radius:14px;padding:16px 18px;color:var(--white);font-weight:850;letter-spacing:.08em;background:linear-gradient(180deg,#1c3540,#10232b)}.primary:disabled{opacity:.55}
    #topBar{position:absolute;z-index:25;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.09);border-radius:13px;background:var(--glass);backdrop-filter:blur(8px)}.micro{font-size:9px;letter-spacing:.16em;color:var(--muted)}#statusValue{font-size:14px;font-weight:850;margin-top:2px}#mode{font-size:11px;font-weight:800;color:var(--gold);text-align:right}#version{font-size:9px;color:#7e8999;text-align:right;margin-top:3px}.pill{padding:5px 8px;border:1px solid rgba(115,217,232,.38);border-radius:999px;background:rgba(115,217,232,.08);color:var(--cyan2);font-size:10px;font-weight:800;margin-top:5px;display:inline-block}
    #guide{position:absolute;z-index:18;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,520px);aspect-ratio:16/9;pointer-events:none}.corner{position:absolute;width:40px;height:40px;border-color:rgba(243,245,247,.62)}.tl{left:0;top:0;border-left:2px solid;border-top:2px solid}.tr{right:0;top:0;border-right:2px solid;border-top:2px solid}.bl{left:0;bottom:0;border-left:2px solid;border-bottom:2px solid}.br{right:0;bottom:0;border-right:2px solid;border-bottom:2px solid}.guideTag{position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);white-space:nowrap;font-size:9px;letter-spacing:.17em;color:rgba(243,245,247,.65)}
    #bottomPanel{position:absolute;z-index:25;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));padding:11px 13px;border:1px solid rgba(255,255,255,.09);border-radius:13px;background:var(--glass);backdrop-filter:blur(8px)}#guideText{text-align:center;font-size:14px;font-weight:750;line-height:1.45}#stateCode{text-align:center;margin-top:4px;font-size:9px;color:#7e8999;letter-spacing:.14em}#actionBar{display:flex;gap:8px;margin-top:9px}.secondary{flex:1;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px;background:rgba(255,255,255,.06);color:var(--white);font-weight:750;font-size:12px}.secondary.gold{border-color:rgba(212,179,107,.36);color:#f2ddb0}#diagnostics{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);white-space:pre-wrap;color:#8e9bad;font:9px/1.45 ui-monospace,monospace}
    #loading{position:absolute;z-index:35;inset:0;display:grid;place-items:center;background:rgba(4,7,12,.90);text-align:center;padding:22px}.spinner{width:46px;height:46px;margin:0 auto 15px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#errorBox{position:absolute;z-index:34;left:12px;right:12px;bottom:126px;padding:14px;border:1px solid rgba(224,122,122,.42);border-radius:13px;background:rgba(43,15,18,.95);font-size:13px;line-height:1.55}.retry{width:100%;margin-top:10px;padding:10px;border-radius:9px;border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.06);color:white;font-weight:750}#flash{position:absolute;z-index:15;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(115,217,232,.20),transparent 58%)}#flash.active{animation:flash .45s ease-out}@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
  .a-enter-vr,.a-enter-vr-button,.a-orientation-modal,.a-enter-ar{display:none!important}
  </style>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
<div id="app">
  <a-scene id="arScene" mindar-image="imageTargetSrc: ./TK_R1_ROTATE_01_v2.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001" color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="targetAnchor" mindar-image-target="targetIndex: 0">
      <a-entity id="rotateRoot" visible="false" position="0 0 0.03">
        <a-text value="PERSPECTIVE SHIFT" color="#f3f5f7" align="center" width="1.45" position="0 0.205 0.025"></a-text>
        <a-text id="rotatePhase" value="STANDBY" color="#d4b36b" align="center" width="1.25" position="0 -0.205 0.025"></a-text>
        <a-entity id="rotateLayer" position="0.022 -0.055 0.018">
          <a-plane width="0.59" height="0.18" color="#07111d" opacity="0.91"></a-plane>
          <a-plane width="0.59" height="0.004" color="#73d9e8" position="0 0.09 0.012" opacity="0.75"></a-plane>
          <a-plane width="0.59" height="0.004" color="#73d9e8" position="0 -0.09 0.012" opacity="0.75"></a-plane>
          <a-plane width="0.004" height="0.18" color="#73d9e8" position="-0.295 0 0.012" opacity="0.75"></a-plane>
          <a-plane width="0.004" height="0.18" color="#d4b36b" position="0.295 0 0.012" opacity="0.65"></a-plane>
          <a-text value="9981  +  1601  =  2957" color="#f3f5f7" align="center" width="1.25" position="0 0.045 0.018"></a-text>
          <a-text value="1080  +  9168  =  ????" color="#b9f3fa" align="center" width="1.25" position="0 -0.045 0.018"></a-text>
          <a-plane id="scanLine" width="0.012" height="0.16" color="#73d9e8" opacity="0.88" position="-0.27 0 0.022"></a-plane>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <div id="intro"><div class="panel">
    <div class="brand">THE KEY SYSTEM</div><div class="lens-title">KEY LENS</div>
    <div class="subtitle">육안으로 확인할 수 없는 숨겨진 정보층을 분석합니다.</div>
    <div class="keyhole"><i></i></div>
    <ul class="steps"><li><b>STEP 1</b><span>KEY LENS를 활성화하세요.</span></li><li><b>STEP 2</b><span>해독할 이미지를 화면 중앙에 맞추세요.</span></li><li><b>STEP 3</b><span>나타난 변화를 팀원과 함께 확인하세요.</span></li></ul>
    <button id="startBtn" class="primary" type="button">KEY LENS ACTIVATE</button>
  </div></div>

  <div id="loading" hidden><div><div class="spinner"></div><strong>KEY LENS ACTIVATING</strong><div style="margin-top:8px;color:var(--muted);font-size:13px">카메라와 이미지 인식 시스템을 준비하고 있습니다.</div></div></div>
  <div id="topBar" hidden><div><div class="micro">KEY LENS STATUS</div><div id="statusValue">READY</div><div id="targetPill" class="pill" hidden>TARGET DETECTED</div></div><div><div id="mode">PERSPECTIVE SHIFT</div><div id="version"></div></div></div>
  <div id="guide" hidden><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div class="guideTag">IMAGE TARGET GUIDE</div></div>
  <div id="bottomPanel" hidden><div id="guideText">해독할 이미지를 화면 중앙에 맞추세요.</div><div id="stateCode">IDLE</div><div id="actionBar" hidden><button id="replayBtn" class="secondary gold" type="button">REPLAY</button><button id="backBtn" class="secondary" type="button">BACK TO SCANNER</button></div><div id="diagnostics" hidden></div></div>
  <div id="errorBox" hidden><div id="errorText"></div><button id="retryBtn" class="retry" type="button">KEY LENS 다시 활성화</button></div><div id="flash"></div>
</div>
<script type="module">
import { KeyLensController } from './key-lens-controller.js?v=024';
const $=(id)=>document.getElementById(id);
new KeyLensController({scene:$('arScene'),targetAnchor:$('targetAnchor'),rotateRoot:$('rotateRoot'),rotateLayer:$('rotateLayer'),scanLine:$('scanLine'),rotatePhase:$('rotatePhase'),intro:$('intro'),startBtn:$('startBtn'),loading:$('loading'),topBar:$('topBar'),bottomPanel:$('bottomPanel'),guide:$('guide'),statusValue:$('statusValue'),targetPill:$('targetPill'),mode:$('mode'),version:$('version'),guideText:$('guideText'),stateCode:$('stateCode'),actionBar:$('actionBar'),replayBtn:$('replayBtn'),backBtn:$('backBtn'),diagnostics:$('diagnostics'),errorBox:$('errorBox'),errorText:$('errorText'),retryBtn:$('retryBtn'),flash:$('flash')});
</script>
</body></html>
