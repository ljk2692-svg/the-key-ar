  },120)
}
function showGroup(key){['rotate','analyze','activate','decrypt','assemble'].forEach(k=>{const g=$('#x-'+k);if(g)g.setAttribute('visible',k===key?'true':'false')})}
function tone(f=650,d=.06){try{const A=window.AudioContext||window.webkitAudioContext;const a=window.__ac||(window.__ac=new A());const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.02;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
function play(key){
  if(current===key)return;
  current=key;showGroup(key);$('#pill').style.display='block';$('#guide').style.display='none';
  const [s,m]=INFO[key];$('#mission').textContent='AR0'+({rotate:1,analyze:2,activate:3,decrypt:4,assemble:5}[key])+' / '+s;
  hud(s,m,'3D SYSTEM LAYER ACTIVE');tone(760,.08);animate(key);
  const hold=key==='assemble'?12000:(key==='activate'||key==='decrypt'?8000:6000);
  setTimeout(()=>{completed.add(key);if(current===key)current=null},hold);
}
function lost(key){
  const cleanup=()=>{
    if(current===key){setTimeout(cleanup,500);return}
    showGroup('__none');$('#pill').style.display='none';$('#guide').style.display='block';
    hud('SCANNING...','안내된 미션 이미지를 화면 중앙에 맞춰주세요.','숨겨진 정보가 활성화됩니다.');
  };
  setTimeout(cleanup,900);
}
function anim(el,name,prop,from,to,dur,loop=false){el.setAttribute('animation__'+name,`property:${prop};from:${from};to:${to};dur:${dur};easing:easeInOutSine;loop:${loop}`)}
function animate(key){
  if(key==='rotate'){const a=$('#rA'),b=$('#rB'),p=$('#rP');anim(a,'spin','rotation','0 0 0','0 0 360',2200,true);anim(b,'spin','rotation','0 0 0','0 0 -360',2600,true);anim(p,'flip','rotation','0 0 0','0 180 0',1800,false)}
  if(key==='analyze'){anim($('#aHalo'),'spin','rotation','0 0 0','0 0 360',2500,true);[1,2,3,4,5].forEach((n,i)=>setTimeout(()=>anim($('#an'+n),'pop','scale','.01 .01 .01','1 1 1',350),i*220))}
  if(key==='activate'){anim($('#fA'),'spin','rotation','0 0 0','0 0 360',2200,true);anim($('#fB'),'spin','rotation','0 0 0','0 0 -360',2600,true)}
  if(key==='decrypt'){anim($('#dRing'),'spin','rotation','0 0 0','0 0 360',2200,true);[1,2,3,4,5].forEach((n,i)=>setTimeout(()=>anim($('#ds'+n),'pop','scale','.01 .01 .01','1 1 1',300),i*180))}
  if(key==='assemble'){[1,2,3,4,5].forEach((n,i)=>setTimeout(()=>anim($('#k'+n),'join','position',$('#k'+n).getAttribute('position'),'0 0 0',800),i*450));setTimeout(()=>anim($('#kFinal'),'grow','scale','.01 .01 .01','1 1 1',800),2600)}
}
function sceneHTML(){return `<a-scene id="arScene" embedded vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false" loading-screen="enabled:false" renderer="alpha:true;antialias:true;colorManagement:true" arjs="sourceType:webcam;sourceWidth:480;sourceHeight:640;displayWidth:480;displayHeight:640;trackingMethod:best;debugUIEnabled:false;patternRatio:0.5;">
<a-entity light="type:ambient;intensity:1.15;color:#b9c7d4"></a-entity>
<a-entity light="type:directional;intensity:1.05;color:#ffffff" position="1 2 2"></a-entity>
<a-marker id="m-rotate" type="pattern" url="${getPatternUrl('rotate')}" emitevents="true"></a-marker>
<a-marker id="m-analyze" type="pattern" url="${getPatternUrl('analyze')}" emitevents="true"></a-marker>
<a-marker id="m-activate" type="pattern" url="${getPatternUrl('activate')}" emitevents="true"></a-marker>

<a-marker id="m-assemble" type="pattern" url="${getPatternUrl('assemble')}" emitevents="true"></a-marker>
<a-entity id="cam" camera look-controls="enabled:false">
  <a-entity id="layer" position="0 0 -1.75">
    <a-entity id="x-rotate" visible="false"><a-torus id="rA" radius=".48" radius-tubular=".055" material="color:#76ddea;metalness:.8;roughness:.2;emissive:#1d5560"></a-torus><a-torus id="rB" radius=".34" radius-tubular=".025" material="color:#d7b66d;metalness:.9;roughness:.18;emissive:#4b3c1f"></a-torus><a-box id="rP" width="1.05" height=".46" depth=".12" material="color:#12202b;metalness:.75;roughness:.22"></a-box><a-text value="PERSPECTIVE SHIFT" position="0 -.50 .04" align="center" width="1.55" color="#dffcff"></a-text></a-entity>
    <a-entity id="x-analyze" visible="false"><a-torus id="aHalo" radius=".52" radius-tubular=".035" material="color:#76ddea;emissive:#76ddea;emissiveIntensity:.65"></a-torus><a-sphere id="an1" position="-.45 .28 .02" radius=".08" scale=".01 .01 .01" material="color:#76ddea;emissive:#76ddea"></a-sphere><a-sphere id="an2" position="0 .42 .02" radius=".08" scale=".01 .01 .01" material="color:#76ddea;emissive:#76ddea"></a-sphere><a-sphere id="an3" position=".45 .24 .02" radius=".08" scale=".01 .01 .01" material="color:#76ddea;emissive:#76ddea"></a-sphere><a-sphere id="an4" position=".28 -.30 .02" radius=".09" scale=".01 .01 .01" material="color:#d7b66d;emissive:#d7b66d"></a-sphere><a-sphere id="an5" position="-.35 -.30 .02" radius=".08" scale=".01 .01 .01" material="color:#76ddea;emissive:#76ddea"></a-sphere><a-box position="0 0 .02" width=".12" height=".12" depth=".10" material="color:#d7b66d;metalness:.9"></a-box><a-text value="CONNECTION DETECTED" position="0 -.60 .02" align="center" width="1.55" color="#dffcff"></a-text></a-entity>
    <a-entity id="x-activate" visible="false"><a-torus id="fA" radius=".50" radius-tubular=".05" material="color:#76ddea;emissive:#21545c"></a-torus><a-torus id="fB" radius=".35" radius-tubular=".025" material="color:#d7b66d;emissive:#493b1f"></a-torus><a-box position="-.38 .26 0" width=".35" height=".18" depth=".12" material="color:#172631"></a-box><a-box position=".38 .26 0" width=".35" height=".18" depth=".12" material="color:#172631"></a-box><a-box position="-.38 -.26 0" width=".35" height=".18" depth=".12" material="color:#172631"></a-box><a-box position=".38 -.26 0" width=".35" height=".18" depth=".12" material="color:#172631"></a-box><a-text value="FORMATION ANALYSIS" position="0 -.60 .02" align="center" width="1.55" color="#dffcff"></a-text></a-entity>
    <a-entity id="x-decrypt" visible="false"><a-box width="1.25" height=".66" depth=".10" material="color:#111a26;metalness:.8"></a-box><a-torus id="dRing" radius=".25" radius-tubular=".035" material="color:#76ddea;emissive:#76ddea"></a-torus>${[1,2,3,4,5].map((n,i)=>`<a-box id="ds${n}" position="${-.48+i*.24} -.22 .08" width=".16" height=".11" depth=".05" scale=".01 .01 .01" material="color:${n===3?'#d7b66d':'#76ddea'};emissive:${n===3?'#493b1f':'#173e46'}"></a-box>`).join('')}<a-text value="DECRYPTION READY" position="0 -.52 .02" align="center" width="1.55" color="#dffcff"></a-text></a-entity>
    <a-entity id="x-assemble" visible="false"><a-box id="k1" position="-1 .6 0" width=".35" height=".12" depth=".10" material="color:#8fa3b4;metalness:1"></a-box><a-box id="k2" position="1 .55 0" width=".35" height=".12" depth=".10" material="color:#8fa3b4;metalness:1"></a-box><a-box id="k3" position="-1 -.5 0" width=".35" height=".12" depth=".10" material="color:#8fa3b4;metalness:1"></a-box><a-box id="k4" position="1 -.5 0" width=".35" height=".12" depth=".10" material="color:#8fa3b4;metalness:1"></a-box><a-box id="k5" position="0 1 0" width=".16" height=".40" depth=".10" material="color:#d7b66d;metalness:1"></a-box><a-entity id="kFinal" scale=".01 .01 .01"><a-torus radius=".42" radius-tubular=".06" material="color:#d7b66d;emissive:#d7b66d;emissiveIntensity:.35"></a-torus><a-box width=".14" height=".55" depth=".10" position="0 -.40 0" material="color:#d7b66d;metalness:1"></a-box></a-entity><a-text value="MISSION COMPLETE" position="0 -.70 .02" align="center" width="1.55" color="#f4d58b"></a-text></a-entity>
  </a-entity>
</a-entity></a-scene>`}
function makeScene(){
  $('#sceneMount').innerHTML=sceneHTML();scene=$('#arScene');
  scene.addEventListener('render-target-loaded',()=>{if(scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0)}},{once:true});
  ['rotate','analyze','activate','decrypt','assemble'].forEach(k=>{const m=$('#m-'+k);m.addEventListener('markerFound',()=>play(k));m.addEventListener('markerLost',()=>lost(k))});
  window.addEventListener('arjs-video-loaded',bindARSource,{once:true});waitARSource();
}
async function start(){
  if(started)return;started=true;$('#intro').style.display='none';$('#hud').style.display='block';$('#bottom').style.display='block';$('#loader').style.display='grid';
  hud('INITIALIZING...','KEY LENS를 활성화하고 있습니다.','카메라와 3D 엔진을 준비합니다.');
  try{
    await acquireCamera();
    hud('CAMERA READY','카메라 연결이 완료되었습니다.','AR 엔진을 준비합니다.');
    makeScene();
  }catch(e){
    started=false;restoreGUM();$('#loader').style.display='none';hud('CAMERA ERROR','카메라를 시작하지 못했습니다.','브라우저의 카메라 권한을 확인해주세요.');
  }
}
$('#start').onclick=start;
const qs=new URLSearchParams(location.search);if(qs.get('demo3d')){setTimeout(()=>{if(!started){started=true;$('#intro').style.display='none';$('#hud').style.display='block';$('#bottom').style.display='block';$('#sceneMount').innerHTML=sceneHTML();scene=$('#arScene');setTimeout(()=>{play(qs.get('demo3d'))},1200)}},300)}
</script></body></html>
