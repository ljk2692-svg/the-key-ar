   above it so real geometry is composited over the camera instead of behind it. */
#sceneMount{position:fixed;inset:0;background:transparent!important;overflow:hidden;z-index:2!important;pointer-events:none!important}

<!-- V15 — SAMSUNG VISUAL VIEWPORT PRODUCTION FIX
Evidence: the Samsung blank screenshots contain the #intro gradient, so the DOM was already parsed;
the card was outside the visible slice of a larger layout viewport. A second screenshot shows the
same mismatch as a full-width scanner with extremely small UI. V15 uses the Visual Viewport as the
single presentation rectangle without guessing a 2x/3x page scale. Chrome's normal path is unchanged.
-->
<div id="intro"><div class="introCard">
  <div class="brand">THE KEY SYSTEM</div>
  <h1>KEY LENS</h1>
  <div class="lead">카메라 사용을 허용한 뒤 <b>KEY LENS START</b>를 눌러주세요.<br>이후 안내된 미션 이미지를 화면 중앙에 맞추면 숨겨진 정보가 열립니다.</div>
  <div id="readyLine">CAMERA + 3D ENGINE 준비 중</div>
  <button id="activate" class="activate" disabled>KEY LENS START</button>
</div></div>
<script>
/* Runs before the AR engines so the start card is placed in the actually visible rectangle first. */
(function installKeyLensViewportGuard(){
  const root=document.documentElement;
  const samsung=/SamsungBrowser/i.test(navigator.userAgent);
  const state={active:false,samsung,rect:{left:0,top:0,width:innerWidth,height:innerHeight}};
  let frame=0;
  function sync(){
    frame=0;
    const vv=window.visualViewport;
    const width=Math.max(1,vv?.width||innerWidth);
    const height=Math.max(1,vv?.height||innerHeight);
    const left=vv?.offsetLeft||0;
    const top=vv?.offsetTop||0;
    const viewportMismatch=Math.abs(left)>.5||width<innerWidth-1;
    const desktopPortrait=innerHeight>innerWidth&&innerWidth>=700;
    const active=samsung||viewportMismatch||desktopPortrait;
    const previous=state.rect;
    const changed=state.active!==active||Math.abs(previous.left-left)>.5||Math.abs(previous.top-top)>.5||Math.abs(previous.width-width)>.5||Math.abs(previous.height-height)>.5;
    state.active=active;
    state.rect={left,top,width,height};
    root.classList.toggle("key-lens-visual-viewport",state.active);
    root.style.setProperty("--kl-vv-left",left+"px");
    root.style.setProperty("--kl-vv-top",top+"px");
    root.style.setProperty("--kl-vv-width",width+"px");
    root.style.setProperty("--kl-vv-height",height+"px");
    root.style.setProperty("--kl-vv-center-x",left+width/2+"px");
    root.style.setProperty("--kl-vv-center-y",top+height/2+"px");
    root.style.setProperty("--kl-guide-width",Math.min(520,width*.86)+"px");
    if(changed)window.dispatchEvent(new Event("keylensviewportchange"));
  }
  function queue(){if(!frame)frame=requestAnimationFrame(sync)}
  state.sync=sync;
  window.__KEY_LENS_VIEWPORT__=state;
  sync();
  window.addEventListener("resize",queue,{passive:true});
  window.addEventListener("orientationchange",queue,{passive:true});
  window.addEventListener("pageshow",queue,{passive:true});
  window.visualViewport?.addEventListener("resize",queue,{passive:true});
  window.visualViewport?.addEventListener("scroll",queue,{passive:true});
  setTimeout(sync,250);
  setTimeout(sync,1000);
})();
</script>

function samsungPortraitRect(sourceW,sourceH){
  const visible=viewportGuard?.rect||{left:0,top:0,width:innerWidth,height:innerHeight};
  const vw=visible.width,vh=visible.height;
  const targetAspect=480/640; // Chrome reference window
  let frameW=vw,frameH=vw/targetAspect;
  if(frameH>vh){frameH=vh;frameW=vh*targetAspect}
  const frameLeft=visible.left+(vw-frameW)/2,frameTop=visible.top+(vh-frameH)/2;
  const sourceAspect=sourceW/sourceH;
  let width,height,left,top;
  if(sourceAspect>targetAspect){
    height=frameH;width=height*sourceAspect;
    left=frameLeft+(frameW-width)/2;top=frameTop;
  }else{
    width=frameW;height=width/sourceAspect;
    left=frameLeft;top=frameTop+(frameH-height)/2;
  }

}

  await wait(900);
  return !token.cancelled;
}

// Browser-normalized camera fit. Chrome keeps its proven fit; Samsung gets a deterministic
// center-cropped 3:4 portrait window without changing page zoom or participant UI scale.
const _containRect=containRect;containRect=function(sourceW,sourceH){
  return (isSamsung||viewportGuard?.active)?samsungPortraitRect(sourceW,sourceH):_containRect(sourceW,sourceH);
