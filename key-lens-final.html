<style>

:root{
  --bg:#060a11;--panel:rgba(7,13,22,.88);--line:rgba(255,255,255,.11);
  --white:#f4f7fa;--muted:#9eabb9;--cyan:#76ddea;--gold:#d7b66d;
  --violet:#a76cff;--ok:#7ff0c2;--danger:#ff8585
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif}
button{font:inherit}.a-enter-vr,.a-enter-ar{display:none!important}
#sceneMount,a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important}
#sceneMount{position:fixed;inset:0;background:#000;overflow:hidden}
#arScene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;background:transparent!important}
#arjs-video{max-width:none!important;max-height:none!important;visibility:visible!important;opacity:1!important;background:#000!important}
#arScene canvas,.a-canvas{max-width:none!important;max-height:none!important;background:transparent!important;visibility:visible!important;opacity:1!important}
#intro{position:fixed;z-index:1000;inset:0;display:grid;place-items:center;padding:22px;
background:radial-gradient(circle at 82% 9%,rgba(118,221,234,.10),transparent 27%),
linear-gradient(180deg,#060a11,#0b121d)}
.introCard{width:min(100%,520px);padding:27px 22px;border-radius:22px;border:1px solid var(--line);
background:linear-gradient(180deg,rgba(18,26,38,.98),rgba(7,12,20,.98));box-shadow:0 30px 80px rgba(0,0,0,.5)}
.brand{font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--gold)}
h1{margin:8px 0 8px;font-size:38px;line-height:1}.lead{font-size:14px;color:var(--muted);line-height:1.55}
.activate{width:100%;margin-top:22px;padding:16px;border-radius:14px;border:1px solid rgba(118,221,234,.42);
background:linear-gradient(180deg,#173943,#10252d);color:#fff;font-weight:900;letter-spacing:.04em}
.activate:disabled{opacity:.55}
#hud{position:fixed;z-index:900;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));
padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);display:none}
.hudRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.micro{font-size:9px;letter-spacing:.16em;color:var(--muted)}
#status{font-size:19px;font-weight:900;margin-top:2px}.pill{display:none;padding:6px 9px;border-radius:999px;
border:1px solid rgba(127,240,194,.28);background:rgba(127,240,194,.08);color:var(--ok);font-size:10px;font-weight:900}
#mission{margin-top:6px;font-size:10px;color:#bdf4fa;letter-spacing:.10em}
#guide{position:fixed;z-index:850;left:50%;top:50%;transform:translate(-50%,-50%);
width:min(86vw,520px);aspect-ratio:1/1;pointer-events:none;display:none}
.corner{position:absolute;width:42px;height:42px;color:#fff}.tl{left:0;top:0;border-left:2px solid;border-top:2px solid}
.tr{right:0;top:0;border-right:2px solid;border-top:2px solid}.bl{left:0;bottom:0;border-left:2px solid;border-bottom:2px solid}
.br{right:0;bottom:0;border-right:2px solid;border-bottom:2px solid}
.scan{position:absolute;left:7%;right:7%;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);
animation:scan 2.2s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(-120px);opacity:.2}50%{transform:translateY(120px);opacity:.9}}
#bottom{position:fixed;z-index:900;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));
padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);display:none}
#message{text-align:center;font-size:14px;font-weight:800;line-height:1.4}#sub{text-align:center;margin-top:4px;color:var(--muted);font-size:11px}
#loader{position:fixed;z-index:950;inset:0;display:none;place-items:center;background:rgba(3,6,11,.87)}
.spin{width:46px;height:46px;border:3px solid rgba(255,255,255,.13);border-top-color:var(--cyan);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}.loaderText{text-align:center;font-size:13px;color:var(--muted)}
#operator{position:fixed;z-index:980;right:10px;top:130px;width:170px;display:none;padding:10px;border:1px solid var(--line);
border-radius:12px;background:rgba(4,8,14,.96)}#operator button{width:100%;margin:3px 0;padding:8px;border:1px solid rgba(255,255,255,.12);
border-radius:8px;background:#111c29;color:white;font-size:10px;text-align:left}


#readyLine{margin-top:12px;font-size:11px;color:var(--muted);line-height:1.5}
#readyLine.ok{color:var(--ok)}
#readyLine.warn{color:#f2cf86}
</style>

  <h1>KEY LENS</h1>
  <div class="lead">카메라 사용을 허용한 뒤 <b>KEY LENS START</b>를 눌러주세요.<br>이후 안내된 미션 이미지를 화면 중앙에 맞추면 숨겨진 정보가 열립니다.</div>

<script>
const EXPERIENCE = {
  rotate:{name:"AR01 / ROTATE",title:"PERSPECTIVE SHIFT",msg:"보이는 정보만으로 판단하지 마십시오."},
  analyze:{name:"AR02 / ANALYZE",title:"CONNECTION DETECTED",msg:"조건을 분리하지 말고 관계를 연결하십시오."},
  activate:{name:"AR03 / FORMATION",title:"FORMATION ANALYSIS",msg:"네 개의 장면이 기록되었습니다."},
  decrypt:{name:"AR04 / DECRYPT",title:"DECRYPTION READY",msg:"5개의 MUSIC DATA가 확보되었습니다."},
  assemble:{name:"AR05 / FINAL",title:"FINAL ACCESS",msg:"최종 접근 신호가 확인되었습니다."}
};
const RESULT = {
  rotate:{status:"PERSPECTIVE SHIFT",msg:"보이는 정보만으로 판단하지 마십시오.",sub:"관점을 바꾸어 정보의 구조를 다시 확인하십시오."},
  analyze:{status:"CONNECTION DETECTED",msg:"조건을 분리하지 말고 관계를 연결하십시오.",sub:"흩어진 정보 사이의 연결을 팀과 공유하십시오."},
  activate:{status:"FORMATION ANALYSIS",msg:"모양이 아닌, 각 장면을 완성한 구성에 주목하십시오.",sub:"HEART · MIRROR · LINK · WAVE / 네 개의 KEY로 ACCESS CODE를 완성하십시오."},
  decrypt:{status:"DECRYPTION READY",msg:"정답은 노래 안에만 있지 않습니다.",sub:"각 기록에 남은 이름과 그 구조를 다시 확인하십시오."},
  assemble:{status:"MISSION COMPLETE",msg:"모든 단서가 연결되었습니다.",sub:"THE KEY ASSEMBLED · FINAL ACCESS AUTHORIZED"}
};
const $=s=>document.querySelector(s);
let scene=null, started=false, current=null, completed=new Set(), lostTimers={};
let audio=null;

function tone(freq=720,dur=.07,gain=.025,type="triangle"){
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audio.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur);
  }catch(_){}
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function setHud(status,msg,sub=""){
  $("#status").textContent=status;$("#message").textContent=msg;$("#sub").textContent=sub;
}
function anim(el,name,property,from,to,dur=900,easing="easeInOutCubic",delay=0){
  el.removeAttribute("animation__"+name);
  el.setAttribute("animation__"+name,{property,from,to,dur,easing,delay});
}
function resetGroup(key){
  const g=$("#exp-"+key); if(!g)return;
  g.setAttribute("visible",false);g.setAttribute("scale","1 1 1");g.setAttribute("rotation","0 0 0");
  g.querySelectorAll("*").forEach(el=>{
    [...el.attributes].forEach(a=>{if(a.name.startsWith("animation__"))el.removeAttribute(a.name)});
  });
}
function materialize(g){
  // Keep the marker group visible at full scale. Entrance motion is handled by child objects.
  // This avoids browsers leaving a marker group at near-zero scale when an animation is interrupted.
  g.setAttribute("visible",true);
  g.setAttribute("scale","1 1 1");
  g.object3D.visible=true;
  g.object3D.scale.set(1,1,1);
}
async function runRotate(){
  const g=$("#exp-rotate"); resetGroup("rotate"); materialize(g); await wait(600);
  const o=$("#r-outer"),i=$("#r-inner"),p=$("#r-plate"),s=$("#r-scan");
  o.setAttribute("rotation","90 0 0");i.setAttribute("rotation","90 0 0");p.setAttribute("rotation","0 0 0");s.setAttribute("position","0 .16 0");
  anim(o,"spin","rotation","90 0 0","90 540 0",2300,"easeInOutSine");
  anim(i,"spin","rotation","90 0 0","90 -720 0",2300,"easeInOutSine");
  anim(s,"sweep","position","0 .16 0","0 .16 -.7",800,"easeInOutSine");
  tone(630,.08);await wait(850);anim(p,"flip","rotation","0 0 0","0 180 0",2300,"easeInOutCubic");tone(850,.08);
  await wait(2450);
}
async function runAnalyze(){
  const g=$("#exp-analyze");resetGroup("analyze");materialize(g);await wait(550);
  const halo=$("#a-halo"),core=$("#a-core");
  if(halo){halo.setAttribute("rotation","90 0 0");anim(halo,"spin","rotation","90 0 0","90 540 0",2600,"easeInOutSine");}
  if(core){core.setAttribute("scale",".05 .05 .05");anim(core,"pulse","scale",".05 .05 .05","1 1 1",500,"easeOutBack");}
  const nodes=[1,2,3,4,5].map(n=>$("#a-node"+n)),bars=[1,2,3,4,5,6].map(n=>$("#a-bar"+n));
  nodes.forEach(n=>{n.setAttribute("scale",".05 .05 .05")});
  bars.forEach(b=>b.setAttribute("scale",".01 1 1"));
  for(let n=0;n<nodes.length;n++){anim(nodes[n],"rise","scale",".05 .05 .05","1 1 1",360,"easeOutBack");tone(520+n*80,.04);await wait(260)}
  for(let n=0;n<bars.length;n++){anim(bars[n],"link","scale",".01 1 1","1 1 1",300,"easeOutCubic");await wait(180)}
  await wait(700);
}
async function runActivate(){
  const g=$("#exp-activate");resetGroup("activate");materialize(g);await wait(600);
  const outer=$("#f-outer"),inner=$("#f-inner"),core=$("#f-core");
  const slots=[1,2,3,4].map(n=>$("#f-slot"+n));
  outer.setAttribute("rotation","90 0 0");inner.setAttribute("rotation","90 0 0");core.setAttribute("scale",".01 .01 .01");
  slots.forEach(s=>s.setAttribute("scale",".02 .02 .02"));
  anim(outer,"spin","rotation","90 0 0","90 720 0",2600,"easeInOutSine");
  anim(inner,"spin","rotation","90 0 0","90 -900 0",2600,"easeInOutSine");
  anim(core,"rise","scale",".01 .01 .01","1 1 1",650,"easeOutBack");tone(520,.08);
  await wait(650);
  for(let i=0;i<slots.length;i++){
    anim(slots[i],"open","scale",".02 .02 .02","1 1 1",420,"easeOutBack");
    tone(610+i*90,.05);await wait(320);
  }
  await wait(700);tone(980,.12);navigator.vibrate?.(70);
}
async function runDecrypt(){
  const g=$("#exp-decrypt");resetGroup("decrypt");materialize(g);await wait(650);
  const l=$("#d-left"),r=$("#d-right"),core=$("#d-core"),ring=$("#d-ring");
  const slots=[1,2,3,4,5].map(n=>$("#d-slot"+n));
  l.setAttribute("position","-.48 .10 0");r.setAttribute("position",".48 .10 0");core.setAttribute("position","0 .06 0");core.setAttribute("scale",".01 .01 .01");
  slots.forEach(s=>s.setAttribute("scale",".02 .02 .02"));
  anim(l,"open","position","-.48 .10 0","-1.08 .13 0",1050,"easeInOutCubic");
  anim(r,"open","position",".48 .10 0","1.08 .13 0",1050,"easeInOutCubic");tone(430,.08,.02,"sawtooth");
  await wait(780);anim(core,"rise","position","0 .06 0","0 .42 0",850,"easeOutCubic");anim(core,"grow","scale",".01 .01 .01","1 1 1",850,"easeOutBack");
  anim(ring,"spin","rotation","90 0 0","90 540 0",1600,"easeInOutSine");tone(760,.09);await wait(900);
  for(let i=0;i<slots.length;i++){
    anim(slots[i],"data","scale",".02 .02 .02","1 1 1",300,"easeOutBack");tone(650+i*70,.04);await wait(220);
  }
  await wait(700);
}
async function runAssemble(){
  const g=$("#exp-assemble");resetGroup("assemble");materialize(g);
  setHud("FINAL ACCESS DETECTED","최종 접근 신호가 확인되었습니다.","THE KEY SYSTEM / FINAL SEQUENCE");
  tone(420,.12,.018,"sine");
  await wait(1800);

  setHud("ACCESS VERIFYING...","확보된 기록을 확인하고 있습니다.","01 · 02 · 03 · 04 · 05");
  const fs=[1,2,3,4,5].map(n=>$("#k-f"+n)),final=$("#k-final"),ring=$("#k-gold-ring");
  const starts=["-1.6 .8 -.8","1.55 .75 -.75","-1.55 .68 .9","1.6 .78 .88","0 1.2 1.6"];
  const ends=["-.58 .24 -.42",".58 .24 -.42","-.58 .24 .42",".58 .24 .42","0 .22 .68"];
  fs.forEach((f,i)=>{f.setAttribute("position",starts[i]);f.setAttribute("rotation","0 "+(i*63)+" 0")});
  final.setAttribute("scale",".01 .01 .01");ring.setAttribute("scale",".01 .01 .01");
  await wait(1500);

  // Five fragments arrive sequentially so the finale reads clearly in real space.
  for(let i=0;i<fs.length;i++){
    const f=fs[i];
    anim(f,"fly","position",starts[i],ends[i],1050,"easeInOutCubic");
    anim(f,"turn","rotation","0 "+(i*63)+" 0","0 0 0",1050,"easeInOutCubic");
    tone(560+i*90,.07,.022);
    await wait(650);
  }
  await wait(900);

  setHud("THE KEY ASSEMBLED","모든 조각이 하나로 연결되었습니다.","FINAL ACCESS SEQUENCE");
  anim(final,"reveal","scale",".01 .01 .01","1 1 1",900,"easeOutBack");
  tone(960,.16,.035);navigator.vibrate?.([50,45,100]);
  await wait(1400);

  setHud("FINAL ACCESS AUTHORIZED","모든 단서가 연결되었습니다.","THE KEY ASSEMBLED");
  anim(ring,"burst","scale",".01 .01 .01","1.55 1.55 1.55",1100,"easeOutCubic");
  tone(1280,.18,.04);
  await wait(1100);
  anim(ring,"settle","scale","1.55 1.55 1.55","1 1 1",650,"easeInOutSine");
  await wait(1400);

  setHud("MISSION COMPLETE","모든 단서가 연결되었습니다.","THE KEY ASSEMBLED · FINAL ACCESS AUTHORIZED");
  // Hold the completed state long enough for photos/video while the target remains visible.
  await wait(8500);
}
const RUN={rotate:runRotate,analyze:runAnalyze,activate:runActivate,decrypt:runDecrypt,assemble:runAssemble};

async function runExperience(key){
  if(current)return;
  if(completed.has(key))return;
  current=key;$("#guide").style.display="none";$("#pill").style.display="block";
  const e=EXPERIENCE[key];$("#mission").textContent=e.name+" // "+e.title;setHud("ACCESS GRANTED",e.msg,"3D SYSTEM LAYER ACTIVE");
  tone(750,.07);navigator.vibrate?.(40);
  try{await RUN[key]();completed.add(key);const r=RESULT[key];setHud(r.status,r.msg,r.sub);tone(1120,.12,.035);navigator.vibrate?.([45,35,85])}
  finally{current=null}
}
function markerFound(key){
  clearTimeout(lostTimers[key]);
  if(current && current!==key)return;
  const g=$("#exp-"+key);
  if(g){g.setAttribute("visible",true);g.setAttribute("scale","1 1 1");g.object3D.visible=true;g.object3D.scale.set(1,1,1);}
  if(!completed.has(key))runExperience(key);
  else{$("#pill").style.display="block";$("#guide").style.display="none";$("#mission").textContent=EXPERIENCE[key].name;setHud("TARGET DETECTED","이 미션은 이미 확인되었습니다.","재실행은 OPERATOR 모드에서만 가능합니다.")}
}
function markerLost(key){
  clearTimeout(lostTimers[key]);
  lostTimers[key]=setTimeout(()=>{
    if(current===key)return;
    resetGroup(key);$("#pill").style.display="none";$("#guide").style.display="block";$("#mission").textContent="SCANNER READY";
    setHud("SCANNING...","안내된 미션 이미지를 화면 중앙에 맞춰주세요.","미션 이미지를 화면 중앙에 맞춰주세요.");
  },1200)
}

scene=$("#arScene");
let cameraReady=false, renderReady=false, startRequested=false, scannerStarted=false;
let fitTimer=null;

function getARVideo(){return document.querySelector("#arjs-video") || document.querySelector("video")}
function getARCanvas(){return scene?.canvas || document.querySelector("#arScene canvas") || document.querySelector(".a-canvas") || document.querySelector("canvas")}
function containRect(sourceW,sourceH){
  const vw=window.innerWidth,vh=window.innerHeight,sa=sourceW/sourceH,va=vw/vh;
  let width,height,left,top;
  if(va>sa){height=vh;width=height*sa;left=(vw-width)/2;top=0}
  else{width=vw;height=width/sa;left=0;top=(vh-height)/2}
  return {width,height,left,top}
}
function applyCameraFit(){
  const video=getARVideo(),canvas=getARCanvas();
  if(!video || !video.videoWidth || !video.videoHeight)return false;
  const r=containRect(video.videoWidth,video.videoHeight);
  [video,canvas].forEach((el,index)=>{
    if(!el)return;
    Object.assign(el.style,{
      position:"fixed",width:r.width+"px",height:r.height+"px",
      left:r.left+"px",top:r.top+"px",margin:"0",transform:"none",
      objectFit:"fill",display:"block",visibility:"visible",opacity:"1",
      background:index===0?"#000":"transparent",zIndex:index===0?"1":"2"
    });
  });
  video.setAttribute("playsinline","");video.setAttribute("autoplay","");video.muted=true;
  if(video.paused)video.play().catch(()=>{});
  if(scene?.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0)}
  cameraReady=true;
  updateReadyState();
  return true;
}
function stabilizeFit(){
  clearInterval(fitTimer);
  let n=0;
  fitTimer=setInterval(()=>{applyCameraFit();if(++n>28)clearInterval(fitTimer)},250);
}
function verifyRenderer(){
  if(!scene || !scene.renderer || !scene.camera)return false;
  const canvas=getARCanvas();
  if(!canvas || canvas.width<2 || canvas.height<2)return false;
  renderReady=true;
  updateReadyState();
  return true;
}
function updateReadyState(){
  const el=$("#readyLine");
  if(cameraReady && renderReady){
    el.textContent="CAMERA READY · 3D ENGINE READY";
    el.className="ok";
    $("#activate").disabled=false;
    if(startRequested)enterScanner();
  }else if(cameraReady){
    el.textContent="CAMERA READY · 3D ENGINE 준비 중";
    el.className="warn";
  }else{
    el.textContent="카메라 사용을 허용해 주세요.";
    el.className="";
  }
}
function boot3D(){
  const g=$("#boot3d"),r1=$("#bootRing1"),r2=$("#bootRing2");
  if(!g)return;
  g.setAttribute("visible","true");g.object3D.visible=true;
  g.setAttribute("scale",".05 .05 .05");
  anim(g,"bootIn","scale",".05 .05 .05","1 1 1",420,"easeOutBack");
  anim(r1,"spin1","rotation","0 0 0","0 0 360",900,"easeInOutSine");
  anim(r2,"spin2","rotation","0 0 0","0 0 -360",1100,"easeInOutSine");
  setTimeout(()=>{anim(g,"bootOut","scale","1 1 1",".01 .01 .01",260,"easeInCubic");setTimeout(()=>g.setAttribute("visible","false"),280)},1050);
}
function enterScanner(){
  if(scannerStarted || !cameraReady || !renderReady)return;
  scannerStarted=true;
  $("#intro").style.display="none";
  $("#loader").style.display="none";
  $("#hud").style.display="block";
  $("#bottom").style.display="block";
  $("#guide").style.display="block";
  setHud("SCANNING...","안내된 미션 이미지를 화면 중앙에 맞춰주세요.","미션 이미지의 인식 영역을 화면 중앙에 맞추면 숨겨진 정보가 열립니다.");
  try{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume?.()}catch(_){}
  boot3D();
}
function requestStart(){
  startRequested=true;
  const v=getARVideo(); if(v?.paused)v.play().catch(()=>{});
  if(cameraReady && renderReady)enterScanner();
  else{
    $("#activate").disabled=true;
    $("#readyLine").textContent="CAMERA + 3D ENGINE 연결을 완료하는 중입니다.";
    $("#readyLine").className="warn";
    setTimeout(()=>{$("#activate").disabled=false;updateReadyState()},1800);
  }
}

$("#activate").addEventListener("click",requestStart);

window.addEventListener("arjs-video-loaded",()=>{
  applyCameraFit();stabilizeFit();
  setTimeout(verifyRenderer,150);
});
scene.addEventListener("render-target-loaded",()=>{
  if(scene.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0)}
  setTimeout(()=>{verifyRenderer();applyCameraFit();stabilizeFit()},150);
},{once:true});
scene.addEventListener("loaded",()=>{setTimeout(()=>{verifyRenderer();applyCameraFit();stabilizeFit()},250)},{once:true});

["rotate","analyze","activate","decrypt","assemble"].forEach(key=>{
  const m=$("#m-"+key);
  m.addEventListener("markerFound",()=>{
    if(!scannerStarted)return;
    m.object3D.visible=true;
    const g=$("#exp-"+key);
    if(g){g.object3D.visible=true;g.object3D.scale.set(1,1,1);g.setAttribute("visible","true")}
    markerFound(key);
  });
  m.addEventListener("markerLost",()=>{if(scannerStarted)markerLost(key)});
});

window.addEventListener("resize",()=>setTimeout(()=>{applyCameraFit();stabilizeFit()},120));
window.addEventListener("orientationchange",()=>setTimeout(()=>{applyCameraFit();stabilizeFit()},500));

setTimeout(()=>{applyCameraFit();verifyRenderer();stabilizeFit()},700);
setTimeout(()=>{
  if(!cameraReady){
    $("#readyLine").textContent="카메라 권한 또는 연결을 확인해 주세요.";
    $("#readyLine").className="warn";
  }
},8000);

if(new URLSearchParams(location.search).get("operator")==="1"){
  $("#operator").style.display="block";
  $("#operator-reset").onclick=()=>{completed.clear();current=null;["rotate","analyze","activate","decrypt","assemble"].forEach(resetGroup);setHud("OPERATOR RESET","모든 미션 재생 상태를 초기화했습니다.","타깃을 다시 비추면 재생됩니다.")};
  document.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>{const k=b.dataset.op;completed.delete(k);resetGroup(k);runExperience(k)});
}

</script>
