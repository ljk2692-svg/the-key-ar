/* Production visual layer: AR.js handles recognition/pose; this DOM layer renders the visible hologram.
   It avoids mobile WebGL/video compositing failures while remaining anchored to the detected marker. */
#spatialLayer{position:fixed;inset:0;z-index:700;pointer-events:none;overflow:hidden;display:none;perspective:900px}
#spatialLayer.active{display:block}
#spatialContent{position:absolute;left:50%;top:50%;width:320px;height:320px;transform:translate(-50%,-50%);transform-origin:center center;filter:drop-shadow(0 18px 34px rgba(0,0,0,.48))}
.holo{position:absolute;inset:0;transform-style:preserve-3d;animation:holoIn .38s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes holoIn{from{opacity:0;transform:scale(.72) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.holoTilt{position:absolute;inset:8% 5% 15%;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-4deg)}
.holoRing{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);border:3px solid rgba(118,221,234,.92);box-shadow:0 0 16px rgba(118,221,234,.65),inset 0 0 14px rgba(118,221,234,.22)}
.holoRing.outer{width:72%;height:72%;animation:ringSpin 4.2s linear infinite}.holoRing.inner{width:48%;height:48%;border-width:2px;border-color:rgba(215,182,109,.92);box-shadow:0 0 14px rgba(215,182,109,.5);animation:ringSpinReverse 3.3s linear infinite}
@keyframes ringSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes ringSpinReverse{to{transform:translate(-50%,-50%) rotate(-360deg)}}
.holoCore{position:absolute;left:50%;top:50%;width:18%;height:18%;transform:translate(-50%,-50%) translateZ(36px);border-radius:18%;background:radial-gradient(circle at 35% 30%,#e6fdff,#76ddea 28%,#173e46 66%,#071018);border:1px solid rgba(255,255,255,.65);box-shadow:0 0 22px rgba(118,221,234,.9),0 0 52px rgba(118,221,234,.28);animation:corePulse 1.55s ease-in-out infinite alternate}
@keyframes corePulse{to{transform:translate(-50%,-50%) translateZ(50px) scale(1.08);filter:brightness(1.18)}}
.holoLabel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);min-width:72%;padding:8px 13px;border-radius:999px;text-align:center;font-weight:900;font-size:12px;letter-spacing:.16em;color:#ecfdff;border:1px solid rgba(118,221,234,.42);background:linear-gradient(180deg,rgba(7,20,29,.84),rgba(3,8,14,.9));box-shadow:0 9px 30px rgba(0,0,0,.42),0 0 18px rgba(118,221,234,.11)}
.holoSub{display:block;margin-top:3px;font-size:8px;letter-spacing:.12em;color:#9fcbd2;font-weight:700}

.network{position:absolute;inset:9%;width:82%;height:82%;overflow:visible;transform:translateZ(18px)}
.network line{stroke:#76ddea;stroke-width:2.1;opacity:.75;filter:drop-shadow(0 0 4px #76ddea);stroke-dasharray:120;stroke-dashoffset:120;animation:drawLine .55s ease-out forwards;animation-delay:var(--d,0s)}
.network line.gold{stroke:#d7b66d;filter:drop-shadow(0 0 4px #d7b66d)}
@keyframes drawLine{to{stroke-dashoffset:0}}

@keyframes dataPop{to{transform:scale(1)}}
/* Final */
.finalGlow{position:absolute;left:50%;top:48%;width:82%;height:82%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(215,182,109,.28),rgba(215,182,109,.06) 42%,transparent 68%);animation:finalGlow 1.25s ease-in-out infinite alternate}@keyframes finalGlow{to{transform:translate(-50%,-50%) scale(1.12);opacity:.82}}

@keyframes fragJoin{to{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}}
.keyholeFinal{position:absolute;left:50%;top:42%;width:48%;height:58%;transform:translate(-50%,-50%) scale(.1);opacity:0;animation:keyholeReveal .72s 2.58s cubic-bezier(.18,.9,.18,1.25) forwards;filter:drop-shadow(0 0 18px rgba(215,182,109,.72))}
.keyholeFinal:before{content:"";position:absolute;left:50%;top:5%;width:62%;aspect-ratio:1;border:8px solid #f0d488;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 20px rgba(215,182,109,.7),inset 0 0 10px rgba(255,244,208,.28)}
.keyholeFinal:after{content:"";position:absolute;left:44%;top:49%;width:12%;height:46%;border-radius:5px;background:linear-gradient(90deg,#8e6d2e,#f5d989,#8e6d2e);box-shadow:0 0 14px rgba(215,182,109,.62)}
@keyframes keyholeReveal{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.finalHolo .holoLabel{opacity:0;animation:finalLabelIn .45s 3.05s ease-out forwards}@keyframes finalLabelIn{to{opacity:1}}

let audio=null;

function tone(freq=720,dur=.07,gain=.025,type="triangle"){
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audio.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur);
  }catch(_){}
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function setHud(status,msg,sub=""){
  $("#status").textContent=status;$("#message").textContent=msg;$("#sub").textContent=sub;

function anim(el,name,property,from,to,dur=900,easing="easeInOutCubic",delay=0){
  el.removeAttribute("animation__"+name);
  el.setAttribute("animation__"+name,{property,from,to,dur,easing,delay});
}
function resetGroup(key){
  const g=$("#exp-"+key); if(!g)return;
  g.setAttribute("visible",false);g.setAttribute("scale","1 1 1");g.setAttribute("rotation","0 0 0");
  g.querySelectorAll("*").forEach(el=>{
    [...el.attributes].forEach(a=>{if(a.name.startsWith("animation__"))el.removeAttribute(a.name)});
  });
}
function materialize(g){
  // Keep the marker group visible at full scale. Entrance motion is handled by child objects.
  // This avoids browsers leaving a marker group at near-zero scale when an animation is interrupted.
  g.setAttribute("visible",true);
  g.setAttribute("scale","1 1 1");
  g.object3D.visible=true;
  g.object3D.scale.set(1,1,1);
}

async function runAssemble(){
  const g=$("#exp-assemble");resetGroup("assemble");materialize(g);

scene=$("#arScene");
let cameraReady=false, renderReady=false, startRequested=false, scannerStarted=false;
let fitTimer=null;

function getARVideo(){return document.querySelector("#arjs-video") || document.querySelector("video")}
function getARCanvas(){return scene?.canvas || document.querySelector("#arScene canvas") || document.querySelector(".a-canvas") || document.querySelector("canvas")}
function containRect(sourceW,sourceH){
  const vw=window.innerWidth,vh=window.innerHeight,sa=sourceW/sourceH,va=vw/vh;
  let width,height,left,top;
  if(va>sa){height=vh;width=height*sa;left=(vw-width)/2;top=0}
  else{width=vw;height=width/sa;left=0;top=(vh-height)/2}
  return {width,height,left,top}
}
function applyCameraFit(){
  const video=getARVideo(),canvas=getARCanvas();
  if(!video || !video.videoWidth || !video.videoHeight)return false;
  const r=containRect(video.videoWidth,video.videoHeight);
  [video,canvas].forEach((el,index)=>{
    if(!el)return;
    Object.assign(el.style,{
      position:"fixed",width:r.width+"px",height:r.height+"px",
      left:r.left+"px",top:r.top+"px",margin:"0",transform:"none",
      objectFit:"fill",display:"block",visibility:"visible",opacity:"1",
      background:index===0?"#000":"transparent",zIndex:index===0?"1":"2"
    });
  });
  video.setAttribute("playsinline","");video.setAttribute("autoplay","");video.muted=true;
  if(video.paused)video.play().catch(()=>{});
  if(scene?.renderer){scene.renderer.setClearColor(0x000000,0);scene.renderer.setClearAlpha(0)}
  cameraReady=true;
  updateReadyState();
  return true;
}
function stabilizeFit(){
  clearInterval(fitTimer);
  let n=0;
  fitTimer=setInterval(()=>{applyCameraFit();if(++n>28)clearInterval(fitTimer)},250);
}
function verifyRenderer(){
  if(!scene || !scene.renderer || !scene.camera)return false;
  const canvas=getARCanvas();
  if(!canvas || canvas.width<2 || canvas.height<2)return false;
  renderReady=true;
  updateReadyState();
  return true;
}
function updateReadyState(){
  const el=$("#readyLine");
  if(cameraReady && renderReady){
    el.textContent="CAMERA READY · 3D ENGINE READY";
    el.className="ok";
    $("#activate").disabled=false;
    if(startRequested)enterScanner();
  }else if(cameraReady){
    el.textContent="CAMERA READY · 3D ENGINE 준비 중";
    el.className="warn";
  }else{
    el.textContent="카메라 사용을 허용해 주세요.";
    el.className="";
  }
}
function boot3D(){
  const g=$("#boot3d"),r1=$("#bootRing1"),r2=$("#bootRing2");
  if(!g)return;
  g.setAttribute("visible","true");g.object3D.visible=true;
  g.setAttribute("scale",".05 .05 .05");
  anim(g,"bootIn","scale",".05 .05 .05","1 1 1",420,"easeOutBack");
  anim(r1,"spin1","rotation","0 0 0","0 0 360",900,"easeInOutSine");
  anim(r2,"spin2","rotation","0 0 0","0 0 -360",1100,"easeInOutSine");

const samsungUIScale=1;
const samsungVisualBoost=1;

// Samsung often supplies a wider landscape camera stream in portrait mode.
// We normalize ONLY the camera/projection rectangle to the same 3:4 portrait window used by Chrome.
function samsungPortraitRect(sourceW,sourceH){
  const vw=window.innerWidth,vh=window.innerHeight;
  const targetAspect=480/640; // Chrome reference window
  let frameW=vw,frameH=vw/targetAspect;
  if(frameH>vh){frameH=vh;frameW=vh*targetAspect}
  const frameLeft=(vw-frameW)/2,frameTop=(vh-frameH)/2;
  const sourceAspect=sourceW/sourceH;
  let width,height,left,top;
  if(sourceAspect>targetAspect){
    height=frameH;width=height*sourceAspect;
    left=frameLeft+(frameW-width)/2;top=frameTop;
  }else{
    width=frameW;height=width/sourceAspect;
    left=frameLeft;top=frameTop+(frameH-height)/2;
  }
  return {width,height,left,top};
}

// Re-assert a 1:1 mobile viewport on Samsung. This prevents a previously pinched/desktop-like
// viewport from being amplified by our application UI.
if(isSamsung){

}

  return `<div class="holo finalHolo"><div class="holoTilt"><div class="finalGlow"></div><div class="holoRing outer" style="border-color:#d7b66d;box-shadow:0 0 20px rgba(215,182,109,.6)"></div><div class="finalAssembly"><i class="finalFrag f1"></i><i class="finalFrag f2"></i><i class="finalFrag f3"></i><i class="finalFrag f4"></i><i class="finalFrag f5"></i><div class="keyholeFinal"></div><div class="sweepGold"></div></div></div><div class="holoLabel" style="border-color:rgba(215,182,109,.55);color:#fff2c9">FINAL ACCESS AUTHORIZED<span class="holoSub" style="color:#d8bf82">THE KEY ASSEMBLED · MISSION COMPLETE</span></div></div>`;

function showSpatial(key){

function projectWorld(v,rect){
  const p=v.clone().project(scene.camera);
  if(!Number.isFinite(p.x)||!Number.isFinite(p.y)||Math.abs(p.z)>2)return null;
  return {x:rect.left+(p.x+1)*.5*rect.width,y:rect.top+(-p.y+1)*.5*rect.height,z:p.z};
}
function updateSpatialAnchor(){
  if(!spatialKey||!spatialMarker||!scene?.camera)return false;
  const canvas=getARCanvas(),content=$("#spatialContent");
  const rect=canvas?.getBoundingClientRect?.(); if(!rect||rect.width<2||rect.height<2)return false;
  try{
    spatialMarker.object3D.updateMatrixWorld(true);scene.camera.updateMatrixWorld(true);
    if(spatialMarker.object3D.visible){
      const M=spatialMarker.object3D.matrixWorld;
      const c=projectWorld(new THREE.Vector3(0,0,0).applyMatrix4(M),rect);
      const l=projectWorld(new THREE.Vector3(-.5,0,0).applyMatrix4(M),rect);
      const r=projectWorld(new THREE.Vector3(.5,0,0).applyMatrix4(M),rect);
      if(c&&l&&r){
        let markerPx=Math.hypot(r.x-l.x,r.y-l.y);
        const boost=samsungVisualBoost;
        const maxSize=Math.min(500*boost,rect.width*.92,rect.height*.72);
        let size=Math.max(220*boost,Math.min(maxSize,markerPx*1.65*boost));
        lastSpatialAnchor={x:c.x,y:c.y,size};
      }
    }
  }catch(_){ }
  const a=lastSpatialAnchor||{x:rect.left+rect.width/2,y:rect.top+rect.height/2,size:Math.max(240*samsungVisualBoost,Math.min(400*samsungVisualBoost,rect.width*.78))};
  content.style.left=a.x+"px";content.style.top=a.y+"px";content.style.width=a.size+"px";content.style.height=a.size+"px";
  const dbg=$("#spatialDebug");if(dbg&&new URLSearchParams(location.search).get("diag")==="1"){dbg.style.display="block";dbg.textContent=`${spatialKey} ${Math.round(a.x)},${Math.round(a.y)} ${Math.round(a.size)}px | ${innerWidth}x${innerHeight} | UI 1.00 | Samsung portrait-normalized`}
  return true;
}

  spatialRAF=0;if(!spatialKey)return;updateSpatialAnchor();spatialRAF=requestAnimationFrame(spatialLoop);
}
